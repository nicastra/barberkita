name: cukurpro

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  server-migrate:
    image: ${IMAGE_REGISTRY:-ghcr.io/nicastra/barberkita}/server-migrate:${IMAGE_TAG:?Set IMAGE_TAG}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    security_opt:
      - no-new-privileges:true

  server:
    image: ${IMAGE_REGISTRY:-ghcr.io/nicastra/barberkita}/server:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      PUBLIC_RATE_LIMIT: ${PUBLIC_RATE_LIMIT:-60}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-262144}
    depends_on:
      postgres:
        condition: service_healthy
      server-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:3000/api/health',
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  client:
    image: ${IMAGE_REGISTRY:-ghcr.io/nicastra/barberkita}/client:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/health']
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 5s
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    depends_on:
      client:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    name: cukurpro_postgres_data
  caddy_data:
    name: cukurpro_caddy_data
  caddy_config:
    name: cukurpro_caddy_config
