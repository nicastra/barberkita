name: CI and production deployment

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: 1.3.0

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Run formatting, type, unit, and build checks
        run: bun run check

      - name: Run real-database acceptance and restore checks
        run: bun run test:e2e

      - name: Validate deployment files
        run: bun run deploy:check

      - name: Build AMD64 server runtime image
        run: docker build --platform linux/amd64 --target runtime --file server/Dockerfile .

      - name: Build AMD64 migration image
        run: docker build --platform linux/amd64 --target migration --file server/Dockerfile .

      - name: Build AMD64 client image
        run: >-
          docker build
          --platform linux/amd64
          --target runtime
          --build-arg VITE_API_BASE_URL=https://app.example.com
          --file client/Dockerfile
          .

      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          --env APP_DOMAIN=app.example.com
          --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10.2-alpine
          caddy validate --config /etc/caddy/Caddyfile

  publish:
    name: Publish immutable images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server runtime
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: server/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/server:${{ github.sha }}
          cache-from: type=gha,scope=server-runtime
          cache-to: type=gha,mode=max,scope=server-runtime

      - name: Build and push migration runner
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: server/Dockerfile
          target: migration
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/server-migrate:${{ github.sha }}
          cache-from: type=gha,scope=server-migrate
          cache-to: type=gha,mode=max,scope=server-migrate

      - name: Require the production app domain
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: test -n "$APP_DOMAIN"

      - name: Build and push client
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: client/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/client:${{ github.sha }}
          build-args: VITE_API_BASE_URL=https://${{ vars.APP_DOMAIN }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://${{ vars.APP_DOMAIN }}
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy the commit SHA
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -p "${VPS_PORT:-22}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -- "$VPS_USER@$VPS_HOST" \
            "cd /opt/cukurpro && git fetch --depth=1 origin '$DEPLOY_SHA' && git checkout --detach '$DEPLOY_SHA' && ./scripts/deploy.sh '$DEPLOY_SHA'"

      - name: Verify public HTTPS health
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          curl --fail --show-error --silent "https://$APP_DOMAIN/health"
          curl --fail --show-error --silent "https://$APP_DOMAIN/api/health"
